name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias del sistema (Qt y OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1-mesa libxkbcommon-x11-0

      - name: Instalar dependencias de Python y PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Compilar ejecutable con PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "open-nvr-viewer" main.py

      - name: Empaquetar en archivo Zip
        run: |
          cd dist
          zip -r ../open-nvr-viewer-linux.zip open-nvr-viewer/

      - name: Crear Release en GitHub y adjuntar el Zip
        uses: softprops/action-gh-release@v2
        with:
          files: open-nvr-viewer-linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
